name: Update Data

on:
  schedule:
    - cron: "00 13 * * *"   # elke dag 13:00 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # RUN SCRAPER (prices.csv bijwerken)
      # =========================
      - name: Run scraper
        run: |
          echo "🔥 RUNNING SCRAPER"
          python pipeline/scraper.py

      # =========================
      # DEBUG (OPTIONEEL MAAR HANDIG)
      # =========================
      - name: Show latest CSV info
        run: |
          echo "📊 CSV preview:"
          python - <<'PYCODE'
          import pandas as pd
          df = pd.read_csv('data/prices.csv')
          if df.empty:
              raise SystemExit('FOUT: prices.csv is leeg')
          for col in ('date', 'fund', 'price'):
              if col not in df.columns:
                  raise SystemExit(f'FOUT: kolom ontbreekt: {col}')
          print(f'Regels: {len(df)}, fondsen: {df.fund.nunique()}')
          latest = df.sort_values('date').groupby('fund', as_index=False).tail(1)
          for _, row in latest.sort_values('fund').iterrows():
              print(f"{row['date']} | {row['fund']} | {row['price']}")
          PYCODE

      # =========================
      # COMMIT DATA
      # =========================
      - name: Commit & push data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/prices.csv data/prices_backup_auto.csv

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Auto update fund data"

            git pull --rebase origin main
            git push origin main
          fi
